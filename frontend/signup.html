<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CineRent</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">CineRent</a>
        <nav class="nav-actions">
            <a class="ghost-button" href="login.html">Login</a>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-panel">
            <h1>Create your account</h1>
            <form id="signupForm">
                <label>Name<input name="name" required></label>
                <label>Email<input name="email" type="email" required></label>
                <label>Password<input name="password" type="password" required></label>
                <button class="primary-button full" type="submit">Sign In / Register</button>
            </form>
            <button id="payAfterSignup" class="secondary-button full" type="button">Pay to Become Paid Customer</button>
            <p id="signupMessage" class="message"></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
