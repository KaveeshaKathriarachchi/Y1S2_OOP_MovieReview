<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contributor Profiles</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>

    body {

        margin: 0;
        padding: 0;
        min-height: 100vh;

        font-family: "Poppins", Arial, sans-serif;

        background:
            linear-gradient(
                rgba(0,0,0,0.75),
                rgba(0,0,0,0.92)
            ),
            url("/images/bg.jpg");

        background-size: cover;
        background-position: center;

        color: white;
    }

    .container {
        width: 90%;
        max-width: 1300px;
        margin: auto;
        padding: 30px;
    }

    h1 {
        text-align: center;
        color: #f5c518;
        margin-bottom: 30px;
        font-size: 46px;
        letter-spacing: 1px;
    }

    .top-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 35px;
    }

    .top-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .top-buttons button {
        padding: 13px 22px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        font-size: 15px;
    }

    .load-btn {
        background: linear-gradient(135deg,#f5c518,#ffd84d);
        color: black;
    }

    .back-btn {
        background: rgba(255,255,255,0.08);
        color: white;
    }

    .logout-btn {
        background: crimson;
        color: white;
    }

    .top-buttons button:hover {
        transform: translateY(-2px);
        opacity: 0.95;
    }

    .search-box {
        flex: 1;
        display: flex;
        justify-content: flex-end;
    }

    .search-box input {
        width: 320px;
        padding: 14px 18px;
        border: none;
        border-radius: 18px;
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 15px;
        outline: none;
    }

    #list {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 30px;
    }

    .card {
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(10px);
        padding: 28px;
        border-radius: 24px;
        transition: 0.3s;
        box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }

    .card:hover {
        transform: translateY(-6px);
    }

    .avatar {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: auto;
        border: 4px solid #f5c518;
        margin-bottom: 22px;
    }

    .card h3 {
        text-align: center;
        color: #f5c518;
        margin-bottom: 18px;
        font-size: 28px;
    }

    .card p {
        margin-bottom: 12px;
        line-height: 1.6;
        color: #ddd;
        font-size: 15px;
    }

    .label {
        color: #f5c518;
        font-weight: bold;
    }

    .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }

    .actions button {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .edit-btn {
        background: linear-gradient(135deg,#f5c518,#ffd84d);
        color: black;
    }

    .delete-btn {
        background: crimson;
        color: white;
    }

    .desc-toggle {
        color: #f5c518;
        margin-left: 8px;
        cursor: pointer;
        font-size: 14px;
    }

  </style>

</head>

<body>

<script>
  if (localStorage.getItem("role") !== "ADMIN") {
      alert("Admins only!");
      window.location.href = "User_input.html";
  }
</script>

<div class="container">

  <h1>🎭 Contributor Profiles</h1>

  <div class="top-section">

    <div class="top-buttons">

      <button class="back-btn" onclick="goBack()">⬅ Back</button>

      <button class="load-btn" onclick="loadContributors()">Load Contributors</button>

      <button class="logout-btn" onclick="logout()">Logout</button>

    </div>

    <div class="search-box">

      <input type="text"
             id="search"
             placeholder="Search contributors..."
             onkeyup="filterContributors()">

    </div>

  </div>

  <ul id="list"></ul>

</div>

<script>

  let contributorsData = [];

  function logout() {
      localStorage.clear();
      window.location.href = "User_input.html";
  }

  function goBack() {
      window.location.href = "add-contributor.html";
  }

  function escapeHtml(text) {
      return (text || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
  }

  function loadContributors() {

      fetch("/contributors/all")
          .then(res => res.json())
          .then(data => {
              contributorsData = data;
              renderContributors(data);
          })
          .catch(err => {
              console.error(err);
              alert("Failed to load contributors");
          });
  }

  function renderContributors(data) {

      const list = document.getElementById("list");
      list.innerHTML = "";

      if (!data || data.length === 0) {
          list.innerHTML = `<p style="text-align:center;color:#bbb;font-size:18px;">No contributors found</p>`;
          return;
      }

      data.forEach(c => {

          const fullDesc = c.description || "No description available";

          const shortDesc =
              fullDesc.length > 120
                  ? fullDesc.substring(0, 120) + "..."
                  : fullDesc;

          const li = document.createElement("li");

          li.innerHTML = `
              <div class="card">

                  <img src="${
                      c.photo ||
                      'https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'
                  }" class="avatar">

                  <h3>${escapeHtml(c.name)}</h3>

                  <p><span class="label">Role:</span> ${escapeHtml(c.role)}</p>

                  <p><span class="label">Date Of Birth:</span> ${c.dateOfBirth || "N/A"}</p>

                  <p><span class="label">Country:</span> ${escapeHtml(c.country)}</p>

                  <p>
                      <span class="label">Description:</span>
                      <span id="desc-${c.id}">
                          ${escapeHtml(shortDesc)}
                      </span>

                      ${
                          fullDesc.length > 120
                          ? `<span class="desc-toggle"
                                   onclick="toggleDesc(event, '${c.id}', \`${escapeHtml(fullDesc)}\`, \`${escapeHtml(shortDesc)}\`)">
                                   See more
                             </span>`
                          : ""
                      }
                  </p>

                  <p><span class="label">Awards:</span> ${escapeHtml(c.awards || "No awards listed")}</p>

                  <p><span class="label">Notable Works:</span> ${escapeHtml(c.notableWorks || "No works listed")}</p>

                  <div class="actions">

                      <button class="edit-btn" onclick="goEdit('${c.id}')">Edit</button>

                      <button class="delete-btn" onclick="del('${c.id}')">Delete</button>

                  </div>

              </div>
          `;

          list.appendChild(li);
      });
  }

  function toggleDesc(event, id, fullText, shortText) {

      event.preventDefault();

      const el = document.getElementById("desc-" + id);
      const link = event.target;

      if (link.innerText === "See more") {
          el.innerText = fullText;
          link.innerText = "See less";
      } else {
          el.innerText = shortText;
          link.innerText = "See more";
      }
  }

  function filterContributors() {

      const value = document.getElementById("search").value.toLowerCase();

      const filtered = contributorsData.filter(c =>
          c.name.toLowerCase().includes(value)
      );

      renderContributors(filtered);
  }

  function del(id) {

      if (!confirm("Are you sure you want to delete this contributor?")) return;

      fetch(`/contributors/delete/${id}`, { method: "DELETE" })
          .then(res => res.text())
          .then(msg => {
              alert(msg);
              loadContributors();
          });
  }

  function goEdit(id) {
      window.location.href = `add-contributor.html?id=${id}`;
  }

  loadContributors();

</script>

</body>
</html>
