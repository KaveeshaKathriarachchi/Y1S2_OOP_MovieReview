<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Movie</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: "Poppins", Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,0.75),
                    rgba(0,0,0,0.92)
                ),
                url("/images/bg.jpg");

            background-size: cover;

            background-position: center;

            color: white;
        }

        .container {

            width: 100%;

            max-width: 700px;

            background: rgba(20,20,20,0.92);

            backdrop-filter: blur(10px);

            border-radius: 24px;

            padding: 40px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.7);

            margin: 20px;
        }

        h1 {

            text-align: center;

            color: #f5c518;

            margin-bottom: 8px;

            font-size: 40px;
        }

        p {

            text-align: center;

            color: #ccc;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 8px;

            color: #f5c518;

            font-weight: 600;
        }

        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border: none;

            border-radius: 16px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 15px;

            box-sizing: border-box;

            transition: 0.3s;
        }

        input:focus,
        select:focus {

            outline: none;

            background: rgba(255,255,255,0.12);

            box-shadow: 0 0 10px rgba(245,197,24,0.5);
        }

        select[multiple] {

            height: 160px;
        }

        option {

            background: #111;

            color: white;
        }

        #preview {

            margin-top: 15px;

            text-align: center;
        }

        #preview img {

            width: 220px;

            border-radius: 16px;

            border: 3px solid #f5c518;

            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 18px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 15px;
        }

        .update-btn {

            background:
                linear-gradient(
                    135deg,
                    #f5c518,
                    #ffd84d
                );

            color: black;
        }

        .update-btn:hover {

            transform: translateY(-2px);

            background: white;
        }

        .delete-btn {

            background: crimson;

            color: white;
        }

        .delete-btn:hover {

            transform: translateY(-2px);

            background: red;
        }

        #result {

            margin-top: 20px;

            text-align: center;

            color: #ffb3b3;

            font-weight: bold;
        }

        @media (max-width: 768px) {

            .container {

                padding: 25px;
            }

            h1 {

                font-size: 32px;
            }
        }

    </style>

</head>

<body>

<script>

    // ADMIN CHECK
    if (localStorage.getItem("role") !== "ADMIN") {

        alert("Admins only");

        window.location.href = "login.html";
    }

</script>

<div class="container">

    <h1>Edit Movie</h1>

    <p>Update movie details</p>

    <!-- TITLE -->
    <label>Title</label>

    <input
            type="text"
            id="title"
            placeholder="Inception"
    >

    <!-- YEAR -->
    <label>Release Year</label>

    <input
            type="number"
            id="year"
            placeholder="2024"
    >

    <!-- POSTER -->
    <label>Poster URL</label>

    <input
            type="text"
            id="poster"
            placeholder="https://image-link"
            oninput="previewImage()"
    >

    <!-- PREVIEW -->
    <div id="preview"></div>

    <!-- ACTORS -->
    <label>Actors (Hold Ctrl to select multiple)</label>

    <select id="actors" multiple></select>

    <!-- DIRECTOR -->
    <label>Director</label>

    <select id="director"></select>

    <!-- UPDATE BUTTON -->
    <button
            class="update-btn"
            onclick="updateMovie()"
    >
        Update Movie
    </button>

    <!-- DELETE BUTTON -->
    <button
            class="delete-btn"
            onclick="deleteMovie()"
    >
        Delete Movie
    </button>

    <!-- RESULT -->
    <div id="result"></div>

</div>

<script>

    const params =
        new URLSearchParams(window.location.search);

    const movieId =
        params.get("id");

    let allContributors = [];

    // PAGE LOAD
    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            if (!movieId) {

                document.getElementById("result").innerText =
                    "Movie ID not found";

                return;
            }

            await loadContributors();

            await loadMovie();
        }
    );

    // LOAD CONTRIBUTORS
    async function loadContributors() {

        try {

            const res =
                await fetch("/contributors/all");

            if (!res.ok) {

                throw new Error(
                    "Failed to load contributors"
                );
            }

            const data =
                await res.json();

            allContributors = data;

            const actorSelect =
                document.getElementById("actors");

            const directorSelect =
                document.getElementById("director");

            actorSelect.innerHTML = "";

            directorSelect.innerHTML = `
                <option value="">
                    Select Director
                </option>
            `;

            data.forEach(c => {

                if (c.role === "Actor") {

                    actorSelect.innerHTML += `
                        <option value="${c.id}">
                            ${c.name}
                        </option>
                    `;
                }

                if (c.role === "Director") {

                    directorSelect.innerHTML += `
                        <option value="${c.id}">
                            ${c.name}
                        </option>
                    `;
                }
            });

        } catch (err) {

            console.error(
                "Error loading contributors:",
                err
            );

            document.getElementById("result").innerText =
                "Failed to load contributors";
        }
    }

    async function loadMovie() {

        try {

            const res =
                await fetch("/movies/all");

            if (!res.ok) {

                throw new Error(
                    "Failed to load movies"
                );
            }

            const data =
                await res.json();

            const movie =
                data.find(
                    m => m.movieId == movieId
                );

            if (!movie) {

                document.getElementById("result").innerText =
                    "Movie not found";

                return;
            }

            document.getElementById("title").value =
                movie.title || "";

            document.getElementById("year").value =
                movie.year || "";

            document.getElementById("poster").value =
                movie.poster || "";

            previewImage();

            const actorSelect =
                document.getElementById("actors");

            const directorSelect =
                document.getElementById("director");

            Array.from(actorSelect.options)
                .forEach(option => {

                    option.selected = false;
                });

            directorSelect.value = "";

            if (movie.contributors) {

                movie.contributors.forEach(c => {

                    const contributor =
                        allContributors.find(
                            x => x.id == c.id
                        );

                    if (!contributor) return;

                    if (contributor.role === "Director") {

                        directorSelect.value =
                            contributor.id;
                    }

                    else if (
                        contributor.role === "Actor"
                    ) {

                        const option =
                            actorSelect.querySelector(
                                `option[value="${contributor.id}"]`
                            );

                        if (option) {

                            option.selected = true;
                        }
                    }
                });
            }

        } catch (err) {

            console.error(
                "Error loading movie:",
                err
            );

            document.getElementById("result").innerText =
                "Failed to load movie";
        }
    }

    function previewImage() {

        const url =
            document.getElementById("poster")
            .value
            .trim();

        const preview =
            document.getElementById("preview");

        if (!url) {

            preview.innerHTML = "";

            return;
        }

        preview.innerHTML = `
            <img
                src="${url}"
                alt="Movie Poster"
                onerror="
                this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg'
                "
            >
        `;
    }

    async function updateMovie() {

        const title =
            document.getElementById("title")
            .value
            .trim();

        const year =
            parseInt(
                document.getElementById("year")
                .value
            );

        const poster =
            document.getElementById("poster")
            .value
            .trim();

        const actorSelect =
            document.getElementById("actors");

        const directorId =
            document.getElementById("director")
            .value;

        const contributors =
            Array.from(actorSelect.selectedOptions)

            .map(opt => ({
                id: opt.value
            }));

        if (directorId) {

            contributors.push({
                id: directorId
            });
        }

        if (
            !title ||
            !year ||
            contributors.length === 0
        ) {

            document.getElementById("result").innerText =
                "Please fill all fields";

            return;
        }

        if (
            poster &&
            !poster.startsWith("http")
        ) {

            document.getElementById("result").innerText =
                "Invalid poster URL";

            return;
        }

        const updatedMovie = {

            movieId: movieId,

            title: title,

            year: year,

            poster: poster,

            contributors: contributors
        };

        try {

            const res =
                await fetch(
                    `/movies/update/${movieId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            updatedMovie
                        )
                    }
                );

            const text =
                await res.text();

            if (!res.ok) {

                throw new Error(text);
            }

            document.getElementById("result").innerText =
                text;

        } catch (err) {

            console.error(
                "Update failed:",
                err
            );

            document.getElementById("result").innerText =
                err.message || "Update failed";
        }
    }

    async function deleteMovie() {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this movie?"
            );

        if (!confirmDelete) return;

        try {

            const res =
                await fetch(
                    `/movies/delete/${movieId}`,
                    {
                        method: "DELETE"
                    }
                );

            const text =
                await res.text();

            if (!res.ok) {

                throw new Error(text);
            }

            alert(text);

            window.location.href =
                "add-movie.html";

        } catch (err) {

            console.error(
                "Delete failed:",
                err
            );

            document.getElementById("result").innerText =
                err.message || "Delete failed";
        }
    }

</script>

</body>

</html>
